              if [ -z "$other" ]; then
                echo "Removing orphaned build cache: $pkg (no package.json, only cache-restorable content)"
                rm -rf "$pkg"
              fi
            done
          done

      - name: Build Stack workspace
        run: bun run build

      - name: Typecheck Stack workspace
        run: bun run typecheck

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      # setup-bun caches its own install cache, so no separate actions/cache
      # step is needed for the bun store.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: bun audit --audit-level=high
