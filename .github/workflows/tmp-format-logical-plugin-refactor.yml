name: Temporary format logical-plugin refactor

on:
  push:
    branches:
      - refactor/logical-plugin-bundles

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/logical-plugin-bundles
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bun run format

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-format-logical-plugin-refactor.yml

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format logical plugin refactor"
          git push origin HEAD:refactor/logical-plugin-bundles
