name: Format repository

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: format-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The formatter version must be the one the lockfile pins, not one this
      # workflow names. Naming it here meant CI formatted with 2.2.0 while the
      # checkout resolved 2.5.15, so a formatting change in a minor release made
      # CI and a local `bun run format` disagree over the same commit. Installing
      # from the lockfile makes them the same binary by construction (#297).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository formatting
        run: |
          bun run format
          if ! git diff --quiet; then
            echo "::error::Repository contains unformatted files. Run 'bun run format' locally before pushing."
            git diff --stat
            git diff
            exit 1
          fi
          echo "Repository formatting is clean."
