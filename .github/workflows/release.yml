name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Automated SemVer Tag & Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout pinned DSH
        run: git submodule update --init --force --depth=1 --recursive DSH

      # setup-bun honours BUN_INSTALL, so each self-hosted runner keeps its own
      # bun install directory and its own cache; nothing shared to race on.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine next SemVer version
        id: versioning
        shell: bash
        run: |
          set -euo pipefail
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            base_version="v0.1.0"
            commits=$(git log --format='%H %s')
          else
            base_version="$latest_tag"
            commits=$(git log "${latest_tag}..HEAD" --format='%H %s')
          fi
          bump="patch"
          if grep -qE '^[a-f0-9]+ (feat|fix)(\([^)]*\))?!:' <<< "$commits"; then
            grep -qE '^[a-f0-9]+ feat(\([^)]*\))?!:' <<< "$commits" && bump="major"
          elif grep -qE '^[a-f0-9]+ feat(\([^)]*\))?:' <<< "$commits"; then
            bump="minor"
          fi
          raw_ver="${base_version#v}"
          IFS='.' read -r major minor patch <<< "$raw_ver"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)); ;;
          esac
          next_version="v${major}.${minor}.${patch}"
          git rev-parse --verify --quiet "refs/tags/$next_version" >/dev/null && exit 1 || true
          echo "tag=$next_version" >> "$GITHUB_OUTPUT"

      - name: Build complete release assets
        run: node scripts/release.mjs assets

      - name: Validate every plugin and pack ZIP asset
        run: node scripts/verify-release-assets.mjs

      - name: Create GitHub release and upload all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
        run: |
          gh release create "$TAG" .release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --generate-notes
