name: Harness update check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for new upstream harness commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Compare pinned harness commit against upstream default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned_sha=$(git ls-tree HEAD DSH | awk '{print $3}')
          harness_url=$(git config --file .gitmodules --get submodule.DSH.url)
          harness_slug=$(echo "$harness_url" | sed -E 's#^https://github.com/##; s#\.git$##')
          default_branch=$(gh api "repos/$harness_slug" --jq .default_branch)
          upstream_sha=$(gh api "repos/$harness_slug/commits/$default_branch" --jq .sha)

          echo "pinned_sha=$pinned_sha"
          echo "upstream_sha=$upstream_sha"

          if [ "$pinned_sha" = "$upstream_sha" ]; then
            echo "harness submodule is up to date with upstream $default_branch"
            exit 0
          fi

          title="Bump pinned harness submodule ($pinned_sha -> $upstream_sha)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"Bump pinned harness submodule\"" --state open --json title --jq '.[0].title // ""')
          if [ -n "$existing" ]; then
            echo "an open harness-bump issue already exists ($existing), not filing another"
            exit 0
          fi

          commit_url="https://github.com/$harness_slug/commit/$upstream_sha"
          compare_url="https://github.com/$harness_slug/compare/$pinned_sha...$upstream_sha"
          body="The pinned DSH/ submodule is behind upstream's $default_branch branch.

          - Pinned commit: $pinned_sha
          - Upstream commit: $upstream_sha ($commit_url)
          - Diff: $compare_url

          Filed automatically by the harness-update-check workflow. Per AGENTS.md, DSH/ is pinned and pristine -- bumping it is a deliberate action (update the submodule pointer, verify the Stack still builds/typechecks/verifies/tests against the new pin, and note any upstream breaking changes), not an automatic sync."

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
