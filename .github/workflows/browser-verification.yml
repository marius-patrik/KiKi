name: Browser verification

# #82: every UI-touching change has to be seen in a real browser before merge.
#
# HTTP 200s and a plugin inventory are preconditions, never the result. A profile
# whose bundle list omits the harness' base rows serves nothing at all, and one
# whose patch layer leaves two clients declaring the same slot serves 200 with
# every entry active while the browser refuses to boot the client tree. Both
# happened during the 0.2.0 migration and neither was visible to any other gate.
on:
  pull_request:
    paths:
      # Client bundles and the surfaces they compose into.
      - "plugins/**/client.js"
      - "plugins/*/src/**/*.{ts,tsx}"
      - "plugins/**/patches/**"
      - "plugins/**/stack.json"
      - "publish/**"
      # The composition itself: boot wiring, profiles, harness pin.
      - "plugins/launcher/**"
      - "scripts/browser-check.mjs"
      - ".github/workflows/browser-verification.yml"
      - "harness"

permissions:
  contents: read
  # The PR comment is the durable record a reviewer sees; the screenshots
  # themselves are attached to the run either way.
  issues: write

concurrency:
  group: browser-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Browser verification
    runs-on: ubuntu-latest
    # The harness build is the long pole; give the job room rather than letting a
    # partial boot look like a pass.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      # setup-bun caches its own install cache, so no separate actions/cache step
      # is needed for the bun store.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build Stack workspace
        run: bun run build

      # The pinned harness is what actually serves the app, so it has to be built
      # too. `bootstrap all` also typechecks it; the harness gate that owns the
      # submodule's own e2e lane is a separate concern and is not reused here,
      # because that lane writes into the pinned checkout.
      - name: Build pinned harness
        run: ./scripts/bootstrap install && ./scripts/bootstrap build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.1

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      # A throwaway home, so the run proves provisioning from nothing rather than
      # inheriting a profile somebody fixed by hand. This is the path that ships
      # the harness' base rows and disables the replaced shells; getting it wrong
      # yields a profile that either never serves or serves a client tree that
      # cannot boot.
      - name: Boot a fresh web profile
        env:
          DSH_HOME: ${{ github.workspace }}/.ci-home
        run: |
          node plugins/launcher/bin/dsh.mjs start
          # The launcher reports readiness through the log, and the browser needs
          # the session token the server generated for this boot.
          for _ in $(seq 1 60); do
            if grep -qE 'dsh web: http' "${TMPDIR:-/tmp}/dsh-web.log" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          grep -E 'dsh web: http' "${TMPDIR:-/tmp}/dsh-web.log" | tail -1

      - name: Verify the primary surfaces in a real browser
        id: verify
        env:
          DSH_HOME: ${{ github.workspace }}/.ci-home
        run: |
          url="$(grep -oE 'http://127\.0\.0\.1:[0-9]+/\?token=[A-Za-z0-9_-]+' "${TMPDIR:-/tmp}/dsh-web.log" | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::the profile never reported a URL; see the boot log above"
            exit 1
          fi
          node scripts/browser-check.mjs "$url" \
            --screenshot "${RUNNER_TEMP}/screenshots/web-profile.png"

      - name: Collect the boot log
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          cp "${TMPDIR:-/tmp}/dsh-web.log" "${RUNNER_TEMP}/screenshots/dsh-web.log" 2>/dev/null || true

      - name: Stop the server
        if: always()
        env:
          DSH_HOME: ${{ github.workspace }}/.ci-home
        run: node plugins/launcher/bin/dsh.mjs stop || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

      # The artifact link is the durable record; a comment puts it on the PR where
      # a reviewer is already looking instead of in a run they have to go find.
      # Never let the check itself be red because a comment could not be posted:
      # the screenshots and boot log are already attached to the run.
      - name: Comment the screenshots on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const file = `${process.env.RUNNER_TEMP}/screenshots/web-profile.png`;
            const passed = '${{ steps.verify.outcome }}' === 'success';
            const shot = passed && fs.existsSync(file);
            const body = [
              `${shot ? '✅' : '❌'} **Browser verification**`,
              '',
              shot
                ? 'Every primary surface rendered in a real browser. Screenshots and the boot log are attached to [this run](' + runUrl + ').'
                : 'The browser check did not pass, so this profile is not proven to render. Read [this run](' + runUrl + ') before merging.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // One comment per run: replace this workflow's previous comment rather
            // than stacking a new one on every push.
            const markerComment = `<!-- browser-verification -->`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(markerComment));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${markerComment}\n${body}` });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: `${markerComment}\n${body}` });
            }