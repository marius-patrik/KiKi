name: CI (Forgejo)

# Dispatch-only. This surface exists as a fallback for when GitHub Actions is
# degraded, not as a second opinion on every push. It runs on the same machine
# as the GitHub self-hosted runners, in an unthrottled container, and running
# the full Canonical Stack workspace suite on both surfaces at once saturated
# the host: an observed FORGEJO-ACTIONS-TASK container held 764% CPU (of 8
# cores) while the GitHub runners and the live harness starved alongside it.
#
# Trigger it when you need it:
#   POST /api/v1/repos/<owner>/<repo>/actions/workflows/<id>/dispatches
on:
  workflow_dispatch:

jobs:
  verify:
    name: Canonical Stack workspace
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Stack workspace
        run: bun run build

      - name: Typecheck Stack workspace
        run: bun run typecheck

      - name: Verify Stack workspace
        run: bun run verify

      - name: Test Stack workspace
        run: bun run test
